# Builds and publishes a release when a version tag is pushed: v1.2.3 for the release channel, v1.2.3-test.1 for the test one.
# The installer and the update feed go to winnewsreader.com/releases/, where the app looks for updates.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version and channel
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Anchor the entire tag, including rejecting newlines and MSBuild/shell metacharacters.
          if ($env:RELEASE_TAG -cnotmatch '\Av(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)\z') {
            throw 'Expected a release tag like v1.2.3 or v1.2.3-test.1.'
          }
          $version = $Matches['version']
          $channel = if ($version -match "-") { "test" } else { "release" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --nologo

      - name: Publish
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish src/App -c Release -r win-x64 --self-contained -p:Platform=x64 "-p:Version=$env:RELEASE_VERSION" -o artifacts/publish --nologo

      - name: Install Velopack
        run: dotnet tool install -g vpk --version 1.2.161

      # The earlier releases in this channel, so Velopack can make delta updates from them. The first release has none.
      - name: Download the earlier releases
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force artifacts/releases | Out-Null
          $feed = Invoke-RestMethod "https://winnewsreader.com/releases/releases.$env:RELEASE_CHANNEL.json" -SkipHttpErrorCheck -StatusCodeVariable status
          if ($status -ne 200 -and -not ($status -eq 404 -and $env:RELEASE_CHANNEL -eq 'test')) {
            throw "Downloading previous release feed failed: HTTP $status"
          }
          # Replacing an existing version must not use its old package as a delta base.
          $feedPath = "artifacts/releases/releases.$env:RELEASE_CHANNEL.json"
          if ($status -eq 200) {
            $feed.Assets = @($feed.Assets | Where-Object Version -ne $env:RELEASE_VERSION)
            foreach ($asset in $feed.Assets) {
              if ($asset.FileName -notmatch '^[A-Za-z0-9._-]+$') { throw 'Invalid release filename.' }
              Invoke-WebRequest "https://winnewsreader.com/releases/$($asset.FileName)" -OutFile (Join-Path artifacts/releases $asset.FileName)
            }
            $feed | ConvertTo-Json -Depth 10 | Set-Content $feedPath
          }

      # Signing is optional: with the three CERTUM_* secrets set, Velopack signs the app, Update.exe and the installer with the
      # Certum certificate through SimplySign; without them nothing is signed and Windows SmartScreen warns. A partial set fails,
      # as does a signing error: an unsigned build never goes out when signing was meant.
      - name: Check signing configuration
        id: signing
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          $names = 'CERTUM_USERNAME', 'CERTUM_OTP_URI', 'CERTUM_KEY_ID'
          $set = @($names | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($set.Count -eq 0) { "sign=false" >> $env:GITHUB_OUTPUT; Write-Host "No signing secrets: this release is unsigned."; return }
          if ($set.Count -ne $names.Count) { throw "Some signing secrets are set and some are not: $($names | Where-Object { $_ -notin $set })" }
          if ($env:CERTUM_KEY_ID -notmatch '^[0-9A-Fa-f]{40}$') { throw 'CERTUM_KEY_ID must contain exactly 40 hexadecimal characters.' }
          # Never echo the provisioning URI.
          $uri = $null
          if (-not [Uri]::TryCreate($env:CERTUM_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
              $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
            throw 'CERTUM_OTP_URI must be the full otpauth://totp provisioning URI, not a one-time code or activation link.'
          }
          "sign=true" >> $env:GITHUB_OUTPUT

      # Reviewed at this immutable revision. Diagnostic screenshots stay disabled.
      - name: Connect to Certum SimplySign
        if: steps.signing.outputs.sign == 'true'
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}
          capture-diagnostics: 'false'

      - name: Pack
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
          SIGN: ${{ steps.signing.outputs.sign }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          $notes = "artifacts/notes.md"
          "# WinNewsReader $env:RELEASE_VERSION`n`nSee https://winnewsreader.com/news/#v$env:RELEASE_VERSION for what is new." | Set-Content $notes
          $packArgs = @("pack", "-u", "WinNewsReaderApp", "-v", "$env:RELEASE_VERSION", "-c", "$env:RELEASE_CHANNEL",
            "-p", "artifacts/publish", "-e", "WinNewsReader.exe", "-o", "artifacts/releases",
            "--packTitle", "WinNewsReader", "--packAuthors", "WinNewsReader", "--framework", "webview2",
            "--icon", "src/App/Assets/AppIcon.ico", "--releaseNotes", $notes)
          # One file at a time: SimplySign is a single authenticated session.
          if ($env:SIGN -eq "true") { $packArgs += @("--signTemplate", "pwsh -NoProfile -File $PWD/packaging/windows/sign-files.ps1 -Path {{file}}", "--signParallel", "1") }
          vpk @packArgs
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed." }
          if ($env:SIGN -eq "true") {
            # Velopack signs its own copy of the app files while packing, so the installer is what to check.
            $files = @(Get-ChildItem artifacts/releases -Include "*Setup.exe" -Recurse | ForEach-Object { $_.FullName })
            ./packaging/windows/sign-files.ps1 -Path $files -VerifyOnly
          }

      # The Microsoft Store package is unsigned because Partner Center signs it.
      # Invalid or placeholder identity must fail, never silently produce a local-test package.
      - name: Build the Store MSIX
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./packaging/windows/build-msix.ps1 -PublishDirectory artifacts/publish -Version "$env:RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: WinNewsReader-MSIX-${{ steps.version.outputs.version }}
          path: |
            artifacts/msix/*-store.msix
            artifacts/msix/*-store.msix.sha256
          if-no-files-found: error

      # A GitHub Release with the installer, for anyone who can open this repository (it is private, so that is the owner and
      # collaborators). The public downloads are the ones on the website, below.
      - name: Attach to a GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          # Copies named WinNewsReader-<version>-Setup.exe and -Portable.zip, kept out of artifacts/releases, which the feed publishes.
          New-Item -ItemType Directory -Force artifacts/release-assets | Out-Null
          $files = foreach ($kind in "Setup.exe", "Portable.zip") {
            $source = Get-ChildItem artifacts/releases -Filter "*$kind" -Recurse | Select-Object -First 1
            if (-not $source) { throw "No $kind was packed." }
            $named = Join-Path "artifacts/release-assets" "WinNewsReader-$env:RELEASE_VERSION-$kind"
            Copy-Item -LiteralPath $source.FullName -Destination $named
            $named
          }
          $flags = @()
          if ("$env:RELEASE_CHANNEL" -eq "test") { $flags += "--prerelease" }
          gh release view "$env:RELEASE_TAG" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Replacing release assets failed.' }
          } else {
            gh release create "$env:RELEASE_TAG" @flags --title "WinNewsReader $env:RELEASE_VERSION" --notes-file artifacts/notes.md @files
            if ($LASTEXITCODE -ne 0) { throw 'Creating release failed.' }
          }

      - name: Assemble the site
        shell: pwsh
        run: |
          Copy-Item -Recurse site _site
          New-Item -ItemType Directory -Force _site/releases | Out-Null
          Copy-Item artifacts/releases/* _site/releases/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
