# Publishes site/ to GitHub Pages (winnewsreader.com) when it changes on main.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      release-run-id:
        description: "Republish the complete site artifact from a successful Release run (blank = normal site update)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.release-run-id == ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Pages replaces the whole site, so the releases that the Release workflow published have to come along with it.
      # Copy the feed directly: vpk on this Linux runner filters for Linux packages, but our releases are Windows packages.
      - name: Keep the published releases
        run: |
          mkdir -p site/releases
          for channel in release test; do
            feed="releases.$channel.json"
            status=$(curl -sSL -o "site/releases/$feed" -w '%{http_code}' "https://winnewsreader.com/releases/$feed")
            if [[ "$channel" == test && "$status" == 404 ]]; then
              rm "site/releases/$feed"
              continue
            fi
            [[ "$status" == 200 ]] || { echo "Cannot preserve $feed: HTTP $status"; exit 1; }
            jq -e '.Assets | length > 0' "site/releases/$feed"
            jq -r '.Assets[].FileName' "site/releases/$feed" > "${RUNNER_TEMP}/release-files.txt"
            while IFS= read -r file; do
              [[ "$file" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid release filename"; exit 1; }
              curl --retry 3 -fsSL -o "site/releases/$file" "https://winnewsreader.com/releases/$file"
            done < "${RUNNER_TEMP}/release-files.txt"
            for file in "WinNewsReaderApp-$channel-Setup.exe" "WinNewsReaderApp-$channel-Portable.zip"; do
              curl --retry 3 -fsSL -o "site/releases/$file" "https://winnewsreader.com/releases/$file"
            done
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  republish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release-run-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate release run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release-run-id }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid release run ID"; exit 1; }
          eligible=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq '.path == ".github/workflows/release.yml" and .event == "push" and .conclusion == "success"')
          [[ "$eligible" == true ]] || { echo "Expected a successful Release workflow run"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: github-pages
          path: release-site
          run-id: ${{ inputs.release-run-id }}
          github-token: ${{ github.token }}
      - name: Restore release files alongside the current site
        run: |
          mkdir release-content
          tar -xf release-site/artifact.tar -C release-content
          test -s release-content/releases/releases.release.json
          jq -e '.Assets | length > 0' release-content/releases/releases.release.json
          cp -a release-content/releases site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
