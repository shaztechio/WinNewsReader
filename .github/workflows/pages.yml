# Publishes site/ to GitHub Pages (winnewsreader.com) when it changes on main.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      release-run-id:
        description: "Republish the complete site artifact from a successful Release run (blank = normal site update)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.release-run-id == ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Pages replaces the whole site, so the releases that the Release workflow published have to come along with it. Until
      # there has been a release there is nothing to keep, and this does nothing.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Keep the published releases
        continue-on-error: true
        run: |
          dotnet tool install -g vpk --version 1.2.161
          mkdir -p site/releases
          for channel in release test; do
            vpk download http --url https://winnewsreader.com/releases/ --channel "$channel" --allowEmptyChannel -o site/releases || true
            for file in "WinNewsReaderApp-$channel-Setup.exe" "WinNewsReaderApp-$channel-Portable.zip"; do
              curl -fsSL -o "site/releases/$file" "https://winnewsreader.com/releases/$file" || rm -f "site/releases/$file"
            done
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  republish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release-run-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate release run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release-run-id }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid release run ID"; exit 1; }
          eligible=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq '.path == ".github/workflows/release.yml" and .event == "push" and .conclusion == "success"')
          [[ "$eligible" == true ]] || { echo "Expected a successful Release workflow run"; exit 1; }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: github-pages
          path: release-site
          run-id: ${{ inputs.release-run-id }}
          github-token: ${{ github.token }}
      - name: Unpack the built release site
        run: |
          mkdir _site
          tar -xf release-site/artifact.tar -C _site
          test -s _site/releases/releases.release.json
          jq -e '.Assets | length > 0' _site/releases/releases.release.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
